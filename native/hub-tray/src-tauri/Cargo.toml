[package]
name = "crosstalk-hub-app"
description = "Crosstalk Hub: start, stop and pair the Crosstalk hub from the menu bar or tray"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "crosstalk_hub_app"
crate-type = ["rlib"]

[[bin]]
name = "crosstalk-hub-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hub_core = { package = "crosstalk-hub-core", path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
