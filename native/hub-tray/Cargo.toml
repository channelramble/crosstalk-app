# Crosstalk Hub: the hub's menu bar and tray app. `core` is plain Rust (service, health, pairing), so it tests fast and
# type-checks for Linux on a Mac; `src-tauri` is the app around it.
[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
# Same as hub/package.json (tauri.conf.json reads the version from there).
version = "0.4.1"
edition = "2021"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Xcode 27's strip corrupts proc-macro dylibs built with MACOSX_DEPLOYMENT_TARGET set (which Tauri always sets),
# making rustc report "can't find crate for `*_macros`". Build-time tools don't need stripping.
[profile.release.build-override]
strip = false
