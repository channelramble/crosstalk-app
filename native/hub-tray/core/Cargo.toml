[package]
name = "crosstalk-hub-core"
description = "What the Crosstalk Hub app knows about the hub: its service, health, pairing and logs (no UI)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "hub_core"

[dependencies]
libc = "0.2"
plist = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
