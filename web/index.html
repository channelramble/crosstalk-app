<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Crosstalk" />
    <meta name="description" content="One group chat for all your coding agents." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Crosstalk</title>
    <!-- The theme saved on this device (src/themeDevice.ts keeps it, with what it paints), put on the page before
         anything is drawn, so the default look never flashes first. A device with no theme saved does nothing here. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("crosstalk.theme.v1");
          if (!saved) return;
          var paint = JSON.parse(saved).paint;
          if (!paint) return;
          var root = document.documentElement;
          var k;
          for (k in paint.vars) root.style.setProperty(k, paint.vars[k]);
          for (k in paint.attrs) root.setAttribute(k, paint.attrs[k]);
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar && paint.color) bar.setAttribute("content", paint.color);
          var status = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (status && paint.scheme === "light") status.setAttribute("content", "default");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
